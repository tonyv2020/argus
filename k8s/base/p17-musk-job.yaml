          resources:
            requests: {memory: "512Mi", cpu: "200m"}
            limits: {memory: "3Gi", cpu: "1000m"}
---
# ─── DESTRUCTIVE: fragment collapse + mis-type repair ───────────────────
#
# The dry-run opens SET TRANSACTION READ ONLY, so a stray write raises
# 25006 rather than touching live data. Run it, read the plan, and only
# then unsuspend the apply Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: argus-p17-merge-dryrun
  namespace: argus
  labels:
    app.kubernetes.io/name: argus
    app.kubernetes.io/component: p17-merge-dryrun
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus
        app.kubernetes.io/component: p17-merge-dryrun
    spec:
      restartPolicy: Never
      containers:
        - name: merge-dryrun
          image: registry.lan/argus/api:latest
          imagePullPolicy: Always
          command:
            - python
            - -m
            - app.services.ingest.domain_merge
            - --domain
            - musk_network
          envFrom:
            - secretRef:
                name: argus-env
          resources:
            requests: {memory: "512Mi", cpu: "200m"}
            limits: {memory: "3Gi", cpu: "1000m"}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: argus-p17-merge-apply
  namespace: argus
  labels:
    app.kubernetes.io/name: argus
    app.kubernetes.io/component: p17-merge-apply
spec:
  # SHIPS SUSPENDED. Unsuspend only after reading the dry-run plan:
  #   kubectl -n argus patch job argus-p17-merge-apply \
  #     -p '{"spec":{"suspend":false}}'
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus
        app.kubernetes.io/component: p17-merge-apply
    spec:
      restartPolicy: Never
      containers:
        - name: merge-apply
          image: registry.lan/argus/api:latest
          imagePullPolicy: Always
          command:
            - python
            - -m
            - app.services.ingest.domain_merge
            - --domain
            - musk_network
            - --apply
          envFrom:
            - secretRef:
                name: argus-env
          resources:
            requests: {memory: "512Mi", cpu: "200m"}
            limits: {memory: "3Gi", cpu: "1000m"}
---
# ─── REPORT-ONLY: the pre-existing inflated Musk contributes_to edges ───
#
# The live graph carries 74 published contributes_to edges from Elon Musk
# totalling $2,049,497,166.36, every one of them citing each FEC sub_id
# exactly 7 times — the pre-P1.6 emitter re-added the dollars on every
# run. This is the SAME defect P1.6 found on Peter Thiel (5.4x, $276M vs
# a true $50.7M), in the same emitter.
#
# The dry-run below is READ-ONLY and is the only one of these two that
# P1.7 runs. Rewriting a dollar figure that is already live on the public
# read path about a named person is an OPERATOR decision (helen + Tony),
# exactly as it was for Thiel — so the apply Job ships suspended and this
# phase does not unsuspend it.
apiVersion: batch/v1
kind: Job
metadata:
  name: argus-p17-fec-repair-dryrun
  namespace: argus
  labels:
    app.kubernetes.io/name: argus
    app.kubernetes.io/component: p17-fec-repair-dryrun
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus
        app.kubernetes.io/component: p17-fec-repair-dryrun
    spec:
      restartPolicy: Never
      containers:
        - name: fec-repair-dryrun
          image: registry.lan/argus/api:latest
          imagePullPolicy: Always
          command:
            - python
            - -m
            - app.services.ingest.fec_individual
            - --repair
            - --donor
            - musk
          envFrom:
            - secretRef:
                name: argus-env
            - secretRef:
                name: argus-fec
          resources:
            requests: {memory: "512Mi", cpu: "200m"}
            limits: {memory: "3Gi", cpu: "1000m"}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: argus-p17-fec-repair-apply
  namespace: argus
  labels:
    app.kubernetes.io/name: argus
    app.kubernetes.io/component: p17-fec-repair-apply
spec:
  # SHIPS SUSPENDED, AND P1.7 DOES NOT UNSUSPEND IT. This rewrites live
  # published dollar figures about a named private individual. helen +
  # Tony decide, per the Thiel precedent:
  #   kubectl -n argus patch job argus-p17-fec-repair-apply \
  #     -p '{"spec":{"suspend":false}}'
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus
        app.kubernetes.io/component: p17-fec-repair-apply
    spec:
      restartPolicy: Never
      containers:
        - name: fec-repair-apply
          image: registry.lan/argus/api:latest
          imagePullPolicy: Always
          command:
            - python
            - -m
            - app.services.ingest.fec_individual
            - --repair
            - --donor
            - musk
            - --apply
          envFrom:
            - secretRef:
                name: argus-env
            - secretRef:
                name: argus-fec
          resources:
            requests: {memory: "512Mi", cpu: "200m"}
            limits: {memory: "3Gi", cpu: "1000m"}
