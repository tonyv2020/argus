# P1.7 — the Musk network, anchored on EXTERNAL IDS.
#
# STAGED, NOT PUBLISHED. Every net-new entity and every edge these jobs
# create carries publication_state=staged + the batch_id below, so
# nothing reaches the public read path until an operator runs
#   POST /api/admin/batches/<batch_id>/publish
# which still refuses 409 while any batch entity lacks a scrutiny verdict.
#
# A Job's pod template is immutable, so pin the image + batch at apply
# time rather than editing a live Job:
#
#   TAG=p17-$(git rev-parse --short=12 HEAD)
#   BATCH=p17-musk-$(date -u +%Y%m%dT%H%M%SZ)
#   sed -e "s|argus/api:latest|argus/api:${TAG}|" -e "s|__BATCH_ID__|${BATCH}|" \
#     k8s/base/p17-musk-job.yaml | kubectl -n argus apply -f -
#
# ORDER MATTERS, exactly as in P1.6. Every downstream pass resolves its
# subject from anchor_registry.canonical_id and REFUSES to mint one from
# a name, so the anchor job has to land first:
#
#   1. argus-p17-anchors        identities + external-ID aliases
#   2. argus-p17-sec-insiders   Form 3/4/5 → held_position (needs sec.cik)
#      argus-p17-sources        USAspending UEI + Senate LDA
#      argus-p17-fec-musk       Schedule A → contributes_to
#   3. argus-p17-scrutiny       the publish precondition
#
# Re-running the anchor job after the source jobs is SAFE but not free:
# upsert_anchor overwrites anchor_registry.external_ids, and senate_lda
# writes the client/registrant ids it accepted back into that same
# keyring. domain_anchors carries those two keys over rather than
# erasing them (P1.6.3 reads the client-id list to decide that an LDA id
# the anchor OWNS is not foreign), but any OTHER discovered key added
# later would need the same treatment.
#
# The merge jobs at the bottom are DESTRUCTIVE and separate: the dry-run
# is read-only, the apply ships suspended.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: argus-p17-anchors
  namespace: argus
  labels:
    app.kubernetes.io/name: argus
    app.kubernetes.io/component: p17-anchors
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus
        app.kubernetes.io/component: p17-anchors
    spec:
      restartPolicy: Never
      containers:
        - name: anchors
          image: registry.lan/argus/api:latest
          imagePullPolicy: Always
          command:
            - python
            - -m
            - app.services.ingest.domain_anchors
            - --domain
            - musk_network
            - --batch-id
            - __BATCH_ID__
          envFrom:
            - secretRef:
                name: argus-env
          resources:
            requests: {memory: "512Mi", cpu: "200m"}
            limits: {memory: "3Gi", cpu: "1000m"}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: argus-p17-sec-insiders
  namespace: argus
  labels:
    app.kubernetes.io/name: argus
    app.kubernetes.io/component: p17-sec-insiders
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus
        app.kubernetes.io/component: p17-sec-insiders
    spec:
      restartPolicy: Never
      containers:
        - name: sec-insiders
          image: registry.lan/argus/api:latest
          imagePullPolicy: Always
          command:
            - python
            - -m
            - app.services.ingest.sec_insiders
            - --priority-domain
            - musk_network
            - --batch-id
            - __BATCH_ID__
          env:
            # SEC's fair-use policy requires a descriptive, contactable
            # User-Agent on every request (sec.gov/os/webmaster-faq).
            - name: SEC_USER_AGENT
              value: "argus-ingest/1.0 (twin@achilles.tonyvigna.com)"
          envFrom:
            - secretRef:
                name: argus-env
          resources:
            requests: {memory: "512Mi", cpu: "200m"}
            limits: {memory: "3Gi", cpu: "1000m"}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: argus-p17-sources
  namespace: argus
  labels:
    app.kubernetes.io/name: argus
    app.kubernetes.io/component: p17-sources
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 5400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus
        app.kubernetes.io/component: p17-sources
    spec:
      restartPolicy: Never
      containers:
        - name: sources
          image: registry.lan/argus/api:latest
          imagePullPolicy: Always
          # USAspending (UEI-verified) + Senate LDA (pattern-gated).
          # Only SpaceX and Tesla declare a UEI; the other five anchors
          # have no SAM registration that resolves to them, so they
          # contribute no contract edges BY DESIGN rather than by a
          # fuzzy name match onto RTX / ALASKA ROAD BORING / etc.
          command:
            - python
            - -m
            - app.services.ingest.domain_sources
            - --domain
            - musk_network
            - --batch-id
            - __BATCH_ID__
          envFrom:
            - secretRef:
                name: argus-env
          resources:
            requests: {memory: "512Mi", cpu: "200m"}
            limits: {memory: "3Gi", cpu: "1000m"}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: argus-p17-fec-musk
  namespace: argus
  labels:
    app.kubernetes.io/name: argus
    app.kubernetes.io/component: p17-fec-individual
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus
        app.kubernetes.io/component: p17-fec-individual
    spec:
      restartPolicy: Never
      containers:
        - name: fec-individual
          image: registry.lan/argus/api:latest
          imagePullPolicy: Always
          command:
            - python
            - -m
            - app.services.ingest.fec_individual
            - --donor
            - musk
            - --batch-id
            - __BATCH_ID__
          envFrom:
            - secretRef:
                name: argus-env
            # A real FEC key is REQUIRED here: the identity predicate
            # has to see every candidate row before it can refuse the
            # wrong ones, and DEMO_KEY caps at ~30 requests/hour.
            - secretRef:
                name: argus-fec
          resources:
            requests: {memory: "512Mi", cpu: "200m"}
            limits: {memory: "3Gi", cpu: "1000m"}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: argus-p17-scrutiny
  namespace: argus
  labels:
    app.kubernetes.io/name: argus
