apiVersion: batch/v1
kind: CronJob
metadata:
  name: scheduled-sweep
  namespace: argus
  labels:
    app.kubernetes.io/name: argus
    app.kubernetes.io/component: scheduled-sweep
spec:
  # Weekly Monday 07:00 UTC (03:00 ET) — off-hours; FEC + LDA + SEC
  # data cadence doesn't move faster than daily so weekly is enough.
  schedule: "0 7 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Skip a missed run rather than backfilling — the sweep is a full
  # priority-domain refresh, not incremental.
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      # Sweep runs a network-bound fetch loop across 4 external APIs;
      # cap at 90 min so a truly hung run is killed rather than
      # blocking the following week.
      activeDeadlineSeconds: 5400
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sweep
              # IMMUTABLE tag encoding the main commit it was built from
              # (d8c3b1c), matching the api Deployment and the FAA ingest
              # CronJob — repo == deployed across all three.
              #
              # The sweep runs FEC/LDA/SEC/USAspending and never touches
              # the aircraft tables, so this is parity rather than a leak
              # fix; the PII redaction it now also carries is incidental
              # to it.
              image: registry.lan/argus/api:p2-d8c3b1c
              # IfNotPresent, not Always: the tag is immutable, so a
              # re-pull can only fetch the same digest. Always would also
              # make the weekly run depend on the registry being up at
              # 07:00 Monday for no benefit.
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - app.services.ingest.scheduled_sweep
              envFrom:
                - secretRef:
                    name: argus-env
                - secretRef:
                    name: argus-fec
                    optional: true
                - secretRef:
                    name: argus-congress
                    optional: true
              resources:
                requests:
                  memory: "1Gi"
                  cpu: "200m"
                limits:
                  # Reproject holds ~11k entities + edges in RAM +
                  # Cypher round-trip buffers — 2Gi OOM'd on the first
                  # live run. 6Gi is a generous ceiling with headroom.
                  memory: "6Gi"
                  cpu: "1000m"
