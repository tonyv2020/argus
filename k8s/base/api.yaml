apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: argus
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: argus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: alembic-upgrade
          # Immutable tag encoding the main commit it was built from,
          # matching both weekly CronJobs — repo == deployed.
          image: registry.lan/argus/api:p2-d8c3b1c
          command:
            - sh
            - -c
            - alembic upgrade head
          envFrom:
            - secretRef:
                name: argus-env
      containers:
        - name: api
          # Immutable tag encoding the main commit it was built from,
          # matching both weekly CronJobs — repo == deployed.
          image: registry.lan/argus/api:p2-d8c3b1c
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: argus-env
            - secretRef:
                name: argus-fec
                optional: true
            - secretRef:
                name: argus-congress
                optional: true
            # RG4 (2026-08-07) — env-injects ARGUS_SERVICE_TOKEN for
            # /api/admin/batches/{id}/{publish,unpublish} + the header-
            # gated include_staged preview. `optional: true` so a
            # cluster without the secret still boots (the token stays
            # empty → admin endpoints refuse every call, preview flag
            # is ignored — safe default).
            - secretRef:
                name: argus-service-token
                optional: true
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
